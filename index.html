<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reflection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f1f0eb;
    --bg-deep: #e2e0d9;
    --ink: #2b2b28;
    --ink-soft: #78766d;
    --accent: #9c998d;
    --line: rgba(43,43,40,0.20);
    --line-faint: rgba(43,43,40,0.08);
    --glow: 0 0 0 rgba(0,0,0,0);
    --transition-speed: 900ms;
  }

  [data-theme="dark"] {
    --bg: #101010;
    --bg-deep: #1a1a19;
    --ink: #e6e4dc;
    --ink-soft: #8f8d85;
    --accent: #b9b6ab;
    --line: rgba(185,182,171,0.30);
    --line-faint: rgba(185,182,171,0.12);
    --glow: 0 0 16px rgba(185,182,171,0.26);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100svh;
    background:
      radial-gradient(120% 70% at 20% 0%, rgba(255,255,255,0.04), transparent 55%),
      radial-gradient(90% 60% at 85% 100%, rgba(0,0,0,0.04), transparent 55%),
      radial-gradient(ellipse at 50% 0%, var(--bg-deep), var(--bg) 68%);
    color: var(--ink);
    font-family: "Cormorant Garamond", serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: auto;
    transition: background var(--transition-speed) ease, color var(--transition-speed) ease;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .opening-scene {
    position: fixed;
    inset: 0;
    z-index: 20;
    overflow: hidden;
    isolation: isolate;
    background: #050505;
    animation: opening-exit 1.1s cubic-bezier(.5,0,.25,1) 8.3s forwards;
  }
  .creation-frame, .creation-frame img, .opening-veil, .contact-flash,
  .spotlight-halo, .light-beam, .opening-statue, .opening-caption {
    position: absolute;
  }
  .creation-frame {
    inset: 0; overflow: hidden; background: #080706;
    perspective: 1500px; perspective-origin: 40% 51.5%;
  }
  .creation-frame img {
    inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: 40% 51.5%;
    transform-origin: 40% 51.5%; transform-style: preserve-3d;
    backface-visibility: hidden; will-change: transform, opacity;
    animation: creation-close 5s cubic-bezier(.45,0,.25,1) both;
  }
  .opening-veil {
    inset: 0;
    z-index: 1;
    background: #050505;
    opacity: 0;
    animation: darkness-falls 1.55s cubic-bezier(.55,0,.3,1) 3.8s both;
  }
  .contact-flash {
    z-index: 2;
    left: 40%;
    top: 51.5%;
    width: min(10vw, 124px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.96), rgba(215,205,185,.32) 28%, transparent 70%);
    opacity: 0;
    transform: translate(-50%,-50%) scale(.15);
    mix-blend-mode: screen;
    pointer-events: none;
    animation: contact-light 1.05s cubic-bezier(.16,1,.3,1) 3.02s both;
  }
  .spotlight-halo {
    z-index: 3;
    inset: 0;
    background: radial-gradient(ellipse 11% 20% at 50% 34%, rgba(255,241,213,.68), rgba(255,230,190,.16) 42%, transparent 74%);
    opacity: 0;
    animation: statue-spot 2.8s cubic-bezier(.2,.7,.25,1) 5.05s forwards;
    pointer-events: none;
  }
  .light-beam {
    z-index: 2;
    top: -14%;
    left: 50%;
    width: min(90vw, 1000px);
    height: 120%;
    background: linear-gradient(180deg, rgba(255,243,216,.24), rgba(255,232,191,.12) 42%, transparent 90%);
    clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%);
    filter: blur(34px);
    opacity: 0;
    transform: translateX(-50%) scaleY(.08);
    transform-origin: 50% 0;
    animation: light-spreads 3.1s cubic-bezier(.4,0,.2,1) 5.65s forwards;
    pointer-events: none;
  }
  .opening-statue {
    z-index: 4;
    left: 50%;
    bottom: 10vh;
    height: min(59svh, 610px);
    max-width: 72vw;
    width: auto;
    object-fit: contain;
    opacity: 0;
    filter: grayscale(1) invert(1) drop-shadow(0 18px 24px rgba(255,239,210,.16));
    mix-blend-mode: screen;
    transform-origin: 50% 85%;
    backface-visibility: hidden;
    will-change: transform, opacity;
    animation: statue-rises 2.75s cubic-bezier(.22,.85,.25,1) 4.9s both;
    pointer-events: none;
  }
  .opening-caption {
    z-index: 5;
    left: 50%;
    bottom: max(5vh, 24px);
    width: min(86vw, 560px);
    margin: 0;
    color: rgba(255,244,222,.88);
    text-align: center;
    font-size: clamp(14px, 2vw, 19px);
    font-style: italic;
    letter-spacing: .035em;
    opacity: 0;
    transform: translate(-50%, 14px);
    text-shadow: 0 0 18px rgba(255,229,180,.65);
    animation: caption-awakens 1.6s cubic-bezier(.2,.7,.25,1) 7.2s forwards;
  }
  .skip-opening {
    position: absolute;
    z-index: 8;
    top: max(18px, env(safe-area-inset-top));
    right: max(18px, env(safe-area-inset-right));
    padding: 9px 13px;
    border: 1px solid rgba(255,255,255,.32);
    border-radius: 999px;
    color: rgba(255,255,255,.78);
    background: rgba(0,0,0,.28);
    font: 10px "Space Mono", monospace;
    letter-spacing: 1px;
    cursor: pointer;
    animation: skip-appears .6s ease 1.2s both;
  }
  .skip-opening:focus-visible { outline: 2px solid white; outline-offset: 3px; }
  .opening-scene.is-ending { animation: opening-exit 700ms ease forwards; }
  .opening-scene.is-hidden { display: none; }

  .scene {
    position: relative;
    width: min(94vw, 620px);
    min-height: min(96svh, 820px);
    padding: 42px 0 18px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .scene::before {
    content: "";
    position: absolute;
    width: min(82vw, 520px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--accent) 13%, transparent), transparent 68%);
    filter: blur(18px);
    opacity: 0.55;
    pointer-events: none;
    z-index: 0;
    animation: breathe 9s ease-in-out infinite alternate;
  }

  /* --- toggle --- */
  .theme-toggle {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    right: max(14px, env(safe-area-inset-right));
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 6;
    transition: border-color var(--transition-speed) ease, color var(--transition-speed) ease, transform 300ms ease;
  }
  .theme-toggle:hover, .theme-toggle:active { border-color: var(--accent); color: var(--accent); transform: rotate(20deg); }
  .theme-toggle svg { width: 16px; height: 16px; }

  .flourish-tl { top: -3%; left: -6%; }
  .flourish-br { bottom: -3%; right: -6%; transform: rotate(180deg); }

  /* --- artwork: recolored via mask, drawn in from a single origin point --- */
  .art-wrap {
    position: relative;
    width: clamp(160px, 46vw, 230px);
    aspect-ratio: 700 / 1125;
    margin-top: 4px;
    z-index: 2;
    transform-style: preserve-3d;
  }
  .art-wrap::before {
    content: "";
    position: absolute;
    inset: 8% -24% 14%;
    z-index: -1;
    border-radius: 50%;
    background: radial-gradient(ellipse, color-mix(in srgb, var(--accent) 30%, transparent), transparent 68%);
    filter: blur(20px);
    opacity: 0;
    transform: translateZ(-36px) scale(.78);
    pointer-events: none;
  }
  .art-wrap::after {
    content: "";
    position: absolute;
    z-index: -1;
    left: 12%;
    right: 12%;
    bottom: 2%;
    height: 18px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--ink) 32%, transparent);
    filter: blur(11px);
    transform: translateZ(-24px) scale(.72);
    opacity: 0;
    pointer-events: none;
  }
  .art-fill {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    transform: translateZ(18px);
    filter: grayscale(1) drop-shadow(1px 0 0 rgba(20,18,15,.2)) drop-shadow(4px 9px 8px rgba(0,0,0,.18));
    mix-blend-mode: multiply;
    opacity: 1;
    clip-path: inset(0 0 100% 0);
  }
  [data-theme="dark"] .art-fill {
    filter: grayscale(1) invert(1) drop-shadow(1px 0 0 rgba(255,255,255,.2)) drop-shadow(4px 9px 10px rgba(0,0,0,.35));
    mix-blend-mode: screen;
  }
  .art-origin {
    position: absolute;
    left: 47%;
    top: 4%;
    width: 10px;
    height: 10px;
    margin: -5px 0 0 -5px;
    border-radius: 50%;
    background: var(--accent);
    filter: blur(3px);
    opacity: 0;
  }

  /* --- text content --- */
  .container {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 460px;
    text-align: center;
    padding: 22px 32px 34px;
  }

  .subtitle {
    letter-spacing: 5px;
    font-family: "Space Mono", monospace;
    font-size: 10.5px;
    color: var(--ink-soft);
    margin: 0;
    opacity: 0;
  }

  h1 {
    font-size: clamp(34px, 9vw, 48px);
    margin: 12px 0;
    font-weight: 400;
    font-style: italic;
    letter-spacing: 1px;
    opacity: 0;
  }

  .concept {
    color: var(--ink-soft);
    line-height: 1.8;
    margin-bottom: 24px;
    font-size: clamp(14px, 3.6vw, 16px);
    opacity: 0;
  }

  hr {
    border: none;
    border-top: 1px solid var(--line-faint);
    width: 64%;
    margin: 22px auto;
    transform: scaleX(0);
    transform-origin: center;
  }

  #quote {
    font-size: clamp(18px, 4.8vw, 24px);
    font-style: italic;
    line-height: 1.6;
    margin: 0;
    opacity: 0;
  }

  #quote-kr {
    font-size: clamp(14px, 3.6vw, 16.5px);
    font-style: normal;
    font-weight: 400;
    color: var(--ink-soft);
    line-height: 1.6;
    margin: 10px 0 0;
    opacity: 0;
  }

  #author {
    margin-top: 14px;
    color: var(--ink-soft);
    letter-spacing: 2px;
    font-family: "Space Mono", monospace;
    font-size: 10.5px;
    opacity: 0;
  }

  .quote-next {
    appearance: none;
    margin-top: 25px;
    padding: 10px 16px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: color-mix(in srgb, var(--bg) 66%, transparent);
    color: var(--ink-soft);
    font: 10px "Space Mono", monospace;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    cursor: pointer;
    opacity: 0;
    transition: color 250ms ease, border-color 250ms ease, background 250ms ease, transform 250ms ease, opacity 600ms ease;
  }
  .quote-next:hover { color: var(--ink); border-color: var(--accent); transform: translateY(-2px); }
  .quote-next:active { transform: translateY(0) scale(0.97); }
  .quote-next:focus-visible, .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .quote-content { transition: opacity 220ms ease, transform 220ms ease; }
  .quote-content.changing { opacity: 0; transform: translateY(7px); }

  /* --- orchestrated load sequence --- */
  @media (prefers-reduced-motion: no-preference) {
    .flourish     { animation: fade-only 1.3s ease forwards, ornament-drift 13s ease-in-out 1.5s infinite alternate; animation-delay: 200ms, 1.5s; }
    .art-wrap      { animation: statue-arrive 1.8s cubic-bezier(.2,.72,.22,1) 450ms both, art-drift 8s ease-in-out 2.8s infinite; }
    .art-wrap::before { animation: halo-bloom 1.5s ease-out 900ms forwards; }
    .art-wrap::after { animation: shadow-settle 1.2s ease-out 1.2s forwards; }
    .art-fill      { animation: artwork-unveil 1.8s cubic-bezier(.35,0,.25,1) 650ms forwards; }
    .art-origin    { animation: origin-pulse 1.8s cubic-bezier(.35,0,.25,1) 650ms forwards; }
    .subtitle   { animation: rise-in 800ms ease forwards; animation-delay: 1.65s; }
    h1          { animation: rise-in 850ms ease forwards; animation-delay: 1.8s; }
    .concept    { animation: rise-in 800ms ease forwards; animation-delay: 1.95s; }
    hr          { animation: expand-in 700ms ease forwards; animation-delay: 2.05s; }
    #quote      { animation: rise-in 850ms ease forwards; animation-delay: 2.15s; }
    #quote-kr   { animation: rise-in 800ms ease forwards; animation-delay: 2.3s; }
    #author     { animation: rise-in 800ms ease forwards; animation-delay: 2.4s; }
    .quote-next { animation: rise-in 800ms ease forwards; animation-delay: 2.5s; }
  }

  @media (prefers-reduced-motion: reduce) {
    .flourish { opacity: 0.5; }
    .art-fill { clip-path: inset(0); }
    .opening-scene { display: none; }
    .art-wrap { transform: none; }
    .art-wrap::before, .art-wrap::after { opacity: .35; transform: none; }
  .art-origin { display: none; }
    .subtitle, h1, .concept, #quote, #quote-kr, #author, .quote-next { opacity: 1; }
    hr { transform: scaleX(1); }
  }

  @keyframes fade-only { to { opacity: 0.42; } }
  @keyframes breathe { from { transform: scale(0.94); opacity: 0.34; } to { transform: scale(1.06); opacity: 0.68; } }
  @keyframes artwork-unveil { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0); } }
  @keyframes creation-close {
    0% { opacity: 0; transform: translate3d(-.4%, .5%, -72px) rotateY(-2.6deg) rotateX(1.6deg) scale(1.01); filter: grayscale(0) invert(0); }
    10% { opacity: 1; transform: translate3d(-.25%, .3%, -48px) rotateY(-2deg) rotateX(1.2deg) scale(1.02); filter: grayscale(0) invert(0); }
    56% { opacity: 1; transform: translate3d(0, 0, -12px) rotateY(-.8deg) rotateX(.4deg) scale(1.17); filter: grayscale(0) invert(0); }
    62% { opacity: 1; transform: translate3d(0, 0, 4px) rotateY(-.3deg) rotateX(0) scale(1.22); filter: grayscale(1) invert(0) contrast(1.08); }
    66% { opacity: 1; transform: translate3d(0, 0, 12px) rotateY(0) rotateX(0) scale(1.24); filter: grayscale(1) invert(1) contrast(1.16); }
    70% { opacity: .96; transform: translate3d(0, 0, 8px) rotateY(0) rotateX(0) scale(1.25); filter: grayscale(1) invert(0) contrast(1.06); }
    79% { opacity: .68; transform: translate3d(0, -.2%, -8px) rotateY(.4deg) scale(1.27); filter: grayscale(1) brightness(.24); }
    100% { opacity: 0; transform: translate3d(0, -.35%, -36px) rotateY(.8deg) scale(1.29); filter: grayscale(1) brightness(.08); }
  }
  @keyframes darkness-falls { 0% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes contact-light { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.18); } 18% { opacity: .96; } 100% { opacity: 0; transform: translate(-50%,-50%) scale(2.15); } }
  @keyframes statue-spot { 0% { opacity: 0; } 45% { opacity: .8; } 100% { opacity: .56; } }
  @keyframes light-spreads { 0% { opacity: 0; transform: translateX(-50%) scaleY(.06); } 48% { opacity: .68; } 100% { opacity: .34; transform: translateX(-50%) scaleY(1); } }
  @keyframes statue-rises {
    0% { opacity: 0; transform: translate(-50%, 36px) perspective(1300px) rotateX(2deg) rotateY(-4deg) translateZ(-22px) scale(.965); }
    76% { opacity: 1; transform: translate(-50%, -2px) perspective(1300px) rotateX(-.4deg) rotateY(.7deg) translateZ(3px) scale(1.004); }
    100% { opacity: 1; transform: translate(-50%, 0) perspective(1300px) rotateX(0) rotateY(0) translateZ(0) scale(1); }
  }
  @keyframes caption-awakens { to { opacity: .86; transform: translate(-50%, 0); } }
  @keyframes skip-appears { to { opacity: .75; } }
  @keyframes opening-exit { to { opacity: 0; visibility: hidden; } }
  @keyframes statue-arrive {
    0% { opacity: 0; transform: perspective(900px) rotateY(-18deg) rotateX(7deg) translate3d(0, 28px, -90px) scale(.88); filter: blur(5px); }
    65% { opacity: 1; transform: perspective(900px) rotateY(4deg) rotateX(-1deg) translate3d(0, -5px, 14px) scale(1.015); filter: blur(0); }
    100% { opacity: 1; transform: perspective(900px) rotateY(0) rotateX(0) translate3d(0, 0, 0) scale(1); filter: blur(0); }
  }
  @keyframes halo-bloom { to { opacity: .9; transform: translateZ(-36px) scale(1); } }
  @keyframes shadow-settle { to { opacity: .42; transform: translateZ(-24px) scale(1); } }
  @keyframes art-drift { 0%, 100% { translate: 0 0; } 50% { translate: 0 -7px; } }
  @keyframes ornament-drift { from { translate: 0 0; } to { translate: 5px -8px; } }
  @keyframes reveal-point { to { clip-path: circle(140% at 47% 4%); } }
  @keyframes origin-pulse {
    0%   { opacity: 0; transform: scale(0.4); }
    10%  { opacity: 1; transform: scale(1); }
    85%  { opacity: 0.6; }
    100% { opacity: 0; transform: scale(1.4); }
  }
  @keyframes rise-in {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes expand-in { to { transform: scaleX(1); } }

  @media (max-width: 420px) {
    .container { padding: 16px 18px 26px; }
    .theme-toggle { width: 36px; height: 36px; }
    .flourish { width: 52%; }
    .scene { width: min(94vw, 620px); padding-top: 50px; padding-bottom: 24px; }
    .art-wrap { width: clamp(138px, 40vw, 190px); }
    .container { padding-bottom: 20px; }
  }
</style>
</head>

  <div class="spotlight-halo" aria-hidden="true"></div>
  <div class="light-beam" aria-hidden="true"></div>
  <img class="opening-statue" src="angel-sculpture-halftone.svg" alt="Winged angel sculpture holding a mirror">
  <p class="opening-caption">Read the past. &nbsp; Write the present. &nbsp; See the future.</p>
  <button class="skip-opening" id="skipOpening" type="button">Skip intro</button>
</div>

<div class="scene">

  <div class="flourish flourish-tl"></div>
  <div class="flourish flourish-br"></div>

  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
    <svg id="toggleIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
      <circle cx="12" cy="12" r="4.2"></circle>
      <line x1="12" y1="2.2" x2="12" y2="4.6"></line>
      <line x1="12" y1="19.4" x2="12" y2="21.8"></line>
      <line x1="4.6" y1="4.6" x2="6.3" y2="6.3"></line>
      <line x1="17.7" y1="17.7" x2="19.4" y2="19.4"></line>
      <line x1="2.2" y1="12" x2="4.6" y2="12"></line>
      <line x1="19.4" y1="12" x2="21.8" y2="12"></line>
      <line x1="4.6" y1="19.4" x2="6.3" y2="17.7"></line>
      <line x1="17.7" y1="6.3" x2="19.4" y2="4.6"></line>
    </svg>
  </button>

  <div class="art-wrap">
    <img class="art-fill" src="angel-sculpture-halftone.svg" alt="Winged angel sculpture holding a mirror">
    <div class="art-origin"></div>
  </div>

  <div class="container">
    <p class="subtitle">PAST · PRESENT · FUTURE</p>
    <h1>Reflection</h1>
    <p class="concept">
      Read the past.<br>
      Write the present.<br>
      See the future.
    </p>
    <hr>
    <p id="quote" class="quote-content" aria-live="polite"></p>
    <p id="quote-kr" class="quote-content"></p>
    <p id="author" class="quote-content"></p>
    <button class="quote-next" id="quoteNext" type="button">Another reflection <span aria-hidden="true">↗</span></button>
  </div>

</div>

<script>
  const openingScene = document.getElementById('openingScene');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const skipOpening = document.getElementById('skipOpening');
  if (reducedMotion) {
    openingScene.remove();
  } else {
    const hideOpening = () => {
      openingScene.classList.add('is-ending');
      window.setTimeout(() => openingScene.remove(), 760);
    };
    skipOpening.addEventListener('click', hideOpening, { once: true });
    openingScene.addEventListener('animationend', (event) => {
      if (event.animationName === 'opening-exit') openingScene.remove();
    });
  }

  const root = document.documentElement;
  const mql = window.matchMedia('(prefers-color-scheme: dark)');
  let manualOverride = null;

  function applyTheme() {
    const dark = manualOverride !== null ? manualOverride : mql.matches;
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    document.getElementById('themeToggle').setAttribute('aria-pressed', String(dark));
  }
  applyTheme();
  mql.addEventListener('change', () => { if (manualOverride === null) applyTheme(); });

  document.getElementById('themeToggle').addEventListener('click', () => {
    const current = root.getAttribute('data-theme') === 'dark';
    manualOverride = !current;
    applyTheme();
  });

  const quotes = [
    { text: "The purpose of art is washing the dust of daily life off our souls.", ko: "예술의 목적은 일상의 먼지를 우리 영혼에서 씻어내는 것이다.", author: "Pablo Picasso" },
    { text: "Simplicity is the ultimate sophistication.", ko: "단순함이야말로 궁극의 정교함이다.", author: "Leonardo da Vinci" },
    { text: "I am not afraid of storms, for I am learning how to sail my ship.", ko: "나는 폭풍이 두렵지 않다, 배를 항해하는 법을 배우고 있으니까.", author: "Louisa May Alcott" },
    { text: "What we know is a drop, what we don't know is an ocean.", ko: "우리가 아는 것은 한 방울이고, 모르는 것은 바다이다.", author: "Isaac Newton" },
    { text: "The future belongs to those who believe in the beauty of their dreams.", ko: "미래는 자신의 꿈이 아름답다고 믿는 사람들의 것이다.", author: "Eleanor Roosevelt" }
  ];
  const quoteEls = ['quote', 'quote-kr', 'author'].map(id => document.getElementById(id));
  let quoteIndex = Math.floor(Math.random() * quotes.length);

  function renderQuote(animate = false) {
    const q = quotes[quoteIndex];
    if (animate) quoteEls.forEach(el => el.classList.add('changing'));
    window.setTimeout(() => {
      document.getElementById('quote').textContent = "\u201C" + q.text + "\u201D";
      document.getElementById('quote-kr').textContent = q.ko;
      document.getElementById('author').textContent = "\u2014 " + q.author;
      if (animate) requestAnimationFrame(() => quoteEls.forEach(el => el.classList.remove('changing')));
    }, animate ? 220 : 0);
  }

  renderQuote();
  document.getElementById('quoteNext').addEventListener('click', () => {
    let nextIndex = quoteIndex;
    while (quotes.length > 1 && nextIndex === quoteIndex) {
      nextIndex = Math.floor(Math.random() * quotes.length);
    }
    quoteIndex = nextIndex;
    renderQuote(true);
  });
</script>

</body>
</html>
